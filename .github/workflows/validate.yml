name: Validate extension

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext-base libglib2.0-bin libxml2-utils nodejs zip unzip
      - name: Validate metadata and sources
        run: |
          jq empty metadata.json
          node --check extension.js
          node --check prefs.js
          xmllint --noout icons/airpods-pair-symbolic.svg schemas/org.gnome.shell.extensions.airpods-battery.gschema.xml
          glib-compile-schemas --strict schemas
          mkdir -p dist
          zip -r "dist/airpods-battery@ozcanpng.dev.shell-extension.zip" \
            metadata.json extension.js prefs.js stylesheet.css LICENSE THIRD_PARTY_NOTICES.md icons schemas \
            -x 'schemas/gschemas.compiled'
          unzip -t "dist/airpods-battery@ozcanpng.dev.shell-extension.zip"
          unzip -Z1 "dist/airpods-battery@ozcanpng.dev.shell-extension.zip" | grep -qx 'metadata.json'
          unzip -Z1 "dist/airpods-battery@ozcanpng.dev.shell-extension.zip" | grep -qx 'schemas/org.gnome.shell.extensions.airpods-battery.gschema.xml'
